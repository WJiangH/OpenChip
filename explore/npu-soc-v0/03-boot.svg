<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img">
<title>OpenChip | Reset, secure boot and execution authorization</title>
<desc>Proposed security-enabled system flow | generic roles, not a Caliptra signal-level specification</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b3a} .edgeLabel{paint-order:stroke;stroke:white;stroke-width:7;stroke-linejoin:round}</style>
<defs>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#3468a0"/></marker>
<marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#28734e"/></marker>
<marker id="arrow-security" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#785297"/></marker>
<marker id="arrow-platform" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#a76a22"/></marker>
<marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker>
</defs>
<text x="50" y="52" font-size="31" font-weight="bold">OpenChip | Reset, secure boot and execution authorization</text>
<text x="50" y="88" font-size="21">Proposed security-enabled system flow | generic roles, not a Caliptra signal-level specification</text>
<rect x="75" y="160" width="285" height="115" rx="3" fill="#fff4e5" stroke="#a76a22" stroke-width="2"/>
<text x="217.5" y="198.5" text-anchor="middle" font-size="21" font-weight="bold">Power / clock / reset</text>
<text x="217.5" y="224.5" text-anchor="middle" font-size="18" font-weight="normal">POR / clock stability</text>
<text x="217.5" y="250.5" text-anchor="middle" font-size="18" font-weight="normal">Board / process adaptation</text>
<rect x="485" y="160" width="345" height="115" rx="3" fill="#fff4e5" stroke="#a76a22" stroke-width="2"/>
<text x="657.5" y="198.5" text-anchor="middle" font-size="21" font-weight="bold">SoC reset / boot sequencer</text>
<text x="657.5" y="224.5" text-anchor="middle" font-size="18" font-weight="normal">Start immutable management ROM</text>
<text x="657.5" y="250.5" text-anchor="middle" font-size="18" font-weight="normal">Keep application CPU held</text>
<rect x="985" y="160" width="350" height="115" rx="3" fill="#f4effa" stroke="#785297" stroke-width="2"/>
<text x="1160.0" y="198.5" text-anchor="middle" font-size="21" font-weight="bold">Caliptra security domain</text>
<text x="1160.0" y="224.5" text-anchor="middle" font-size="18" font-weight="normal">Initialize RoT / authenticate own FW</text>
<text x="1160.0" y="250.5" text-anchor="middle" font-size="18" font-weight="normal">OTP / entropy / lifecycle inputs</text>
<rect x="75" y="430" width="285" height="125" rx="3" fill="#f3f5f7" stroke="#52606d" stroke-width="2"/>
<text x="217.5" y="473.5" text-anchor="middle" font-size="21" font-weight="bold">Firmware image source</text>
<text x="217.5" y="499.5" text-anchor="middle" font-size="18" font-weight="normal">QSPI flash / recovery host</text>
<text x="217.5" y="525.5" text-anchor="middle" font-size="18" font-weight="normal">Untrusted image bytes</text>
<rect x="485" y="430" width="345" height="125" rx="3" fill="#f4effa" stroke="#785297" stroke-width="2"/>
<text x="657.5" y="473.5" text-anchor="middle" font-size="21" font-weight="bold">Protected staging memory</text>
<text x="657.5" y="499.5" text-anchor="middle" font-size="18" font-weight="normal">Load application image / manifest</text>
<text x="657.5" y="525.5" text-anchor="middle" font-size="18" font-weight="normal">Prevent unauthorized mutation</text>
<rect x="985" y="430" width="350" height="125" rx="3" fill="#f4effa" stroke="#785297" stroke-width="2"/>
<text x="1160.0" y="473.5" text-anchor="middle" font-size="21" font-weight="bold">Authorize application firmware</text>
<text x="1160.0" y="499.5" text-anchor="middle" font-size="18" font-weight="normal">Signature / policy / version checks</text>
<text x="1160.0" y="525.5" text-anchor="middle" font-size="18" font-weight="normal">Management ROM uses RoT services</text>
<rect x="985" y="715" width="350" height="135" rx="3" fill="#f4effa" stroke="#785297" stroke-width="2"/>
<text x="1160.0" y="763.5" text-anchor="middle" font-size="21" font-weight="bold">Execution authorization</text>
<text x="1160.0" y="789.5" text-anchor="middle" font-size="18" font-weight="normal">Lock verified executable bytes</text>
<text x="1160.0" y="815.5" text-anchor="middle" font-size="18" font-weight="normal">Set bus / debug / DMA permissions</text>
<rect x="485" y="715" width="345" height="135" rx="3" fill="#edf3fb" stroke="#3468a0" stroke-width="2"/>
<text x="657.5" y="763.5" text-anchor="middle" font-size="21" font-weight="bold">Release application CPU</text>
<text x="657.5" y="789.5" text-anchor="middle" font-size="18" font-weight="normal">Run NPU firmware / application</text>
<text x="657.5" y="815.5" text-anchor="middle" font-size="18" font-weight="normal">DMA restricted to assigned buffers</text>
<rect x="1435" y="430" width="300" height="125" rx="3" fill="#f4effa" stroke="#785297" stroke-width="2"/>
<text x="1585.0" y="473.5" text-anchor="middle" font-size="21" font-weight="bold">Reject / report / recover</text>
<text x="1585.0" y="499.5" text-anchor="middle" font-size="18" font-weight="normal">Application remains held</text>
<text x="1585.0" y="525.5" text-anchor="middle" font-size="18" font-weight="normal">No silent fallback to unsigned FW</text>
<rect x="1435" y="715" width="300" height="135" rx="3" fill="#fff4e5" stroke="#a76a22" stroke-width="2"/>
<text x="1585.0" y="763.5" text-anchor="middle" font-size="21" font-weight="bold">Runtime fault / watchdog</text>
<text x="1585.0" y="789.5" text-anchor="middle" font-size="18" font-weight="normal">Quiesce transactions before reset</text>
<text x="1585.0" y="815.5" text-anchor="middle" font-size="18" font-weight="normal">Escalation policy TBD</text>
<polyline points="360,218 485,218" fill="none" stroke="#a76a22" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-platform)"/>
<text x="422" y="199" text-anchor="middle" font-size="18" class="edgeLabel">stable / reset</text>
<polyline points="830,218 985,218" fill="none" stroke="#a76a22" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-platform)"/>
<text x="905" y="197" text-anchor="middle" font-size="18" class="edgeLabel">ordered bring-up</text>
<polyline points="360,493 485,493" fill="none" stroke="#28734e" stroke-width="2.5" marker-end="url(#arrow-data)"/>
<text x="423" y="473" text-anchor="middle" font-size="18" class="edgeLabel">image data</text>
<polyline points="660,275 660,430" fill="none" stroke="#3468a0" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-control)"/>
<text x="762" y="367" text-anchor="middle" font-size="18" class="edgeLabel">ROM load control</text>
<polyline points="1160,275 1160,430" fill="none" stroke="#785297" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-security)"/>
<text x="1270" y="367" text-anchor="middle" font-size="18" class="edgeLabel">security services</text>
<polyline points="830,493 985,493" fill="none" stroke="#28734e" stroke-width="2.5" marker-end="url(#arrow-data)"/>
<text x="908" y="473" text-anchor="middle" font-size="18" class="edgeLabel">image / manifest</text>
<polyline points="1160,555 1160,715" fill="none" stroke="#785297" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-security)"/>
<text x="1235" y="637" text-anchor="middle" font-size="18" class="edgeLabel">authorized</text>
<polyline points="1335,493 1435,493" fill="none" stroke="#785297" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-security)"/>
<text x="1385" y="473" text-anchor="middle" font-size="18" class="edgeLabel">rejected</text>
<polyline points="985,783 830,783" fill="none" stroke="#785297" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-security)"/>
<text x="908" y="763" text-anchor="middle" font-size="18" class="edgeLabel">release</text>
<polyline points="660,850 660,915 1590,915 1590,850" fill="none" stroke="#a76a22" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-platform)"/>
<text x="1130" y="902" text-anchor="middle" font-size="18" class="edgeLabel">fault / watchdog</text>
<polyline points="1590,715 1590,555" fill="none" stroke="#a76a22" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-platform)"/>
<text x="1648" y="640" text-anchor="middle" font-size="18" class="edgeLabel">contain / recover</text>
<text x="75" y="968" font-size="19">Clock/reset implementation view: control, NPU and security are logical domains; independent clocks / power islands are not yet selected.</text>
<text x="75" y="1003" font-size="19">Functional bring-up is a separate non-security acceptance stage. FPGA OTP/entropy models do not prove production silicon security.</text>
</svg>