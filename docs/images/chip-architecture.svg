<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">OpenChip target SoC architecture</title>
  <desc id="desc">A standalone chip running the complete stories260K FP32 model at a 40-token runtime context. The autonomous boot sequencer has a separate path to the core subordinate CSR and reset controls. Inside the chip are CoralNPU, boot ROM, working SRAM, AXI fabric, flash controller, UART, system control, debug and test. External NOR flash stores firmware and the complete model. A serial terminal provides input and output. Boot proceeds from reset to ROM to checked flash firmware and inference without a host loader. Logical target architecture; implementation and physical qualification are tracked separately.</desc>
