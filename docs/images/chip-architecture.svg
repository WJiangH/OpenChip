  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#183c30}.muted{fill:#50695e}.line{stroke:#35785c;stroke-width:2;fill:none}.block{fill:white;stroke:#adc6b9}.small{font-size:16px}.label{font-size:21px;font-weight:600}</style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M1 1L9 5L1 9Z" fill="#35785c"/>
  </marker>
  </defs>
