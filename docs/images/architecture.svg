<text x="244" y="884" font-size="14" font-weight="600" fill="#2C2C2A">8 · Release — the evidence package</text>
<text x="244" y="904" font-size="12" fill="#5F5E5A">coverage · formal · co-sim · signoff · GL-sim all green</text>
<text x="244" y="921" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#5F5E5A">reproducible from a clean clone · Tiny Tapeout optional</text>

<rect x="220" y="962" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780"/><text x="240" y="972" font-size="12" fill="#888780">definition &amp; data</text>
<rect x="350" y="962" width="12" height="12" rx="2" fill="#FAECE7" stroke="#D85A30"/><text x="370" y="972" font-size="12" fill="#888780">contract</text>
<rect x="440" y="962" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#1D9E75"/><text x="460" y="972" font-size="12" fill="#888780">build</text>
