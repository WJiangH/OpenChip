<text x="244" y="788" font-size="14" font-weight="600" fill="#26215C">7 · Gate-level verification</text>
<text x="244" y="808" font-size="12" fill="#3C3489">gate-level simulation + SDF · re-runs the same firmware</text>
<text x="244" y="825" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#3C3489">Icarus / Verilator</text>
<line x1="440" y1="834" x2="440" y2="854" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

