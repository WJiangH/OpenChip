<svg width="880" viewBox="0 0 880 1000" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>OpenChip end-to-end framework</title>
<desc>AI agent loop on top; main flow: workload analysis, architecture exploration, spec contract, three parallel tracks (DV, RTL and formal, software), HW/SW co-verification, physical implementation, gate-level verification, release with evidence package.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="20" y="20" width="840" height="100" rx="8" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
<text x="40" y="42" font-size="13" fill="#888780">The AI-agent loop — identical at every stage</text>
<rect x="40" y="52" width="170" height="44" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="125" y="70" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">Generate artifacts</text>
<text x="125" y="88" font-size="10.5" fill="#5F5E5A" text-anchor="middle">spec · RTL · tb · firmware</text>
<line x1="214" y1="74" x2="246" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="250" y="52" width="170" height="44" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="335" y="70" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">Run the tools</text>
<text x="335" y="88" font-size="10.5" fill="#5F5E5A" text-anchor="middle">sim · formal · PnR</text>
<line x1="424" y1="74" x2="456" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="460" y="52" width="170" height="44" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="545" y="70" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">Read diagnostics</text>
<text x="545" y="88" font-size="10.5" fill="#5F5E5A" text-anchor="middle">machine-readable, iterate</text>
<line x1="634" y1="74" x2="666" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="670" y="52" width="170" height="44" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="755" y="70" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">Quality gates decide</text>
<text x="755" y="88" font-size="10.5" fill="#5F5E5A" text-anchor="middle">green, or it didn't happen</text>
<path d="M755 96 L755 108 L125 108 L125 100" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

<rect x="220" y="148" width="440" height="72" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="244" y="174" font-size="14" font-weight="600" fill="#2C2C2A">1 · Workload analysis</text>
<text x="244" y="194" font-size="12" fill="#5F5E5A">operator profiling · area / frequency constraints</text>
<text x="244" y="211" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#5F5E5A">PyTorch · ONNX</text>
<line x1="440" y1="220" x2="440" y2="242" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="220" y="246" width="440" height="72" rx="6" fill="#F1EFE8" stroke="#888780"/>
<text x="244" y="272" font-size="14" font-weight="600" fill="#2C2C2A">2 · Architecture exploration</text>
<text x="244" y="292" font-size="12" fill="#5F5E5A">design space exploration · cost model → ADR</text>
<text x="244" y="309" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#5F5E5A">Timeloop · Accelergy</text>
<line x1="440" y1="318" x2="440" y2="338" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="20" y="342" width="840" height="72" rx="6" fill="#FAECE7" stroke="#D85A30"/>
<text x="44" y="368" font-size="14" font-weight="600" fill="#4A1B0C">3 · Spec — the HW/SW contract, single source of truth</text>
<text x="44" y="388" font-size="12" fill="#993C1D">programmer's model / TRM · ISA · memory map · register map · quantization arithmetic rules</text>
<text x="44" y="405" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#993C1D">Markdown · SystemRDL (PeakRDL)</text>
<line x1="155" y1="414" x2="155" y2="436" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="440" y1="414" x2="440" y2="436" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="725" y1="414" x2="725" y2="436" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="20" y="440" width="270" height="100" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="40" y="466" font-size="14" font-weight="600" fill="#26215C">4a · DV first</text>
<text x="40" y="486" font-size="12" fill="#3C3489">vplan · golden model · red first</text>
<text x="40" y="504" font-size="12" fill="#3C3489">constrained-random · coverage</text>
<text x="40" y="524" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#3C3489">cocotb · Verilator · RISCOF</text>

<rect x="305" y="440" width="270" height="100" rx="6" fill="#E1F5EE" stroke="#1D9E75"/>
<text x="325" y="466" font-size="14" font-weight="600" fill="#04342C">4b · RTL + Formal</text>
<text x="325" y="486" font-size="12" fill="#0F6E56">RTL design · lint · red → green</text>
<text x="325" y="504" font-size="12" fill="#0F6E56">property verification (BMC)</text>
<text x="325" y="524" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#0F6E56">SV · Verible · SymbiYosys</text>

<rect x="590" y="440" width="270" height="100" rx="6" fill="#E1F5EE" stroke="#1D9E75"/>
<text x="610" y="466" font-size="14" font-weight="600" fill="#04342C">4c · Software stack</text>
<text x="610" y="486" font-size="12" fill="#0F6E56">firmware · compiler · runtime</text>
<text x="610" y="504" font-size="12" fill="#0F6E56">bit-accurate ISS (functional model)</text>
<text x="610" y="524" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#0F6E56">RISC-V GCC · QEMU/Renode</text>

<line x1="155" y1="540" x2="155" y2="556" stroke="#888780" stroke-width="1.5"/>
<line x1="440" y1="540" x2="440" y2="556" stroke="#888780" stroke-width="1.5"/>
