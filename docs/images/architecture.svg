<line x1="440" y1="556" x2="440" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="220" y="570" width="440" height="72" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
<text x="244" y="596" font-size="14" font-weight="600" fill="#26215C">5 · HW/SW co-verification</text>
<text x="244" y="616" font-size="12" fill="#3C3489">lock-step co-simulation · the same binary on both sides</text>
<text x="244" y="633" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#3C3489">Renode + Verilator</text>
<rect x="690" y="580" width="170" height="52" rx="6" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
<text x="706" y="601" font-size="13" fill="#888780">Optional · FPGA</text>
<text x="706" y="620" font-size="11" fill="#888780">faster SW testing</text>
<line x1="660" y1="606" x2="690" y2="606" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="440" y1="642" x2="440" y2="662" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="220" y="666" width="440" height="72" rx="6" fill="#E1F5EE" stroke="#1D9E75"/>
<text x="244" y="692" font-size="14" font-weight="600" fill="#04342C">6 · Physical implementation</text>
<text x="244" y="712" font-size="12" fill="#0F6E56">synthesis · STA · place-and-route · signoff (DRC/LVS)</text>
<text x="244" y="729" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#0F6E56">Yosys · OpenSTA · LibreLane · Magic/KLayout/Netgen</text>
<line x1="440" y1="738" x2="440" y2="758" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

